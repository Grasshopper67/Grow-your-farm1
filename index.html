<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garden World 3D — Hyper Realistic Edition</title>
<style>
:root{--ink:#1a2b20;--green:#2e643b;--cream:#fdfbf7;--line:#e2d9c1;--muted:#647560}
*{box-sizing:border-box;user-select:none}body{margin:0;overflow:hidden;background:#9ecfdc;color:var(--ink);font-family:system-ui,Segoe UI,sans-serif}#world{position:fixed;inset:0}canvas{display:block}
header{position:fixed;z-index:3;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.brand,.stats,.panel,.bottom{background:#fffef8f0;backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(30,50,35,0.12);pointer-events:auto}
.brand{padding:10px 16px;display:flex;align-items:center;gap:10px}.brand .logo{font-size:28px}.brand h1{margin:0;font-size:20px}.brand small{display:block;font-size:10px;color:var(--muted)}
.stats{display:flex;overflow:hidden}.stat{padding:9px 14px;border-left:1px solid #eee5d1;min-width:90px}.stat:first-child{border:0}.stat small{display:block;font-size:9px;text-transform:uppercase;color:var(--muted);font-weight:800;letter-spacing:.5px}.stat b{font-size:16px}
.xp-bar{height:5px;background:#e2dac5;border-radius:5px;margin-top:5px;overflow:hidden}.xp-fill{height:100%;background:var(--green);width:0%;transition:width .3s}
.sidebar{position:fixed;z-index:3;left:14px;top:96px;bottom:90px;width:290px;overflow:auto;display:flex;flex-direction:column;gap:10px;pointer-events:none}.panel{padding:14px;pointer-events:auto}.panel h2{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center}.muted{color:var(--muted);font-size:10px;line-height:1.5}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;padding:8px 4px}
button{border:0;border-radius:10px;background:var(--green);color:white;font-weight:800;font-size:10px;padding:8px 10px;cursor:pointer;box-shadow:0 3px 0 #1b3d24;transition:transform .08s, filter .15s}button:hover:not(:disabled){filter:brightness(1.1)}button:active:not(:disabled){transform:translateY(1px)}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#e8f0df;color:#2f4e34;box-shadow:0 3px 0 #c4d4b5}.gold{background:#d48b1d;box-shadow:0 3px 0 #945d12}.blue{background:#2872a8;box-shadow:0 3px 0 #174567}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #eee8db}.item:first-of-type{border-top:0}.emoji{width:30px;font-size:22px;text-align:center}.info{flex:1;min-width:0}.info b{display:block;font-size:11px}.info small{display:block;color:var(--muted);font-size:9px}.count{font-size:10px;color:#4a6248;font-weight:900}
.badge{font-size:8px;padding:2px 6px;border-radius:6px;background:#fae19c;color:#7a5207;font-weight:800;text-transform:uppercase;margin-left:4px}
.bottom{position:fixed;z-index:3;left:50%;bottom:12px;transform:translateX(-50%);padding:9px 16px;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 20px)}.message{font-size:11px;min-width:220px;text-align:center;font-weight:600}.bottom button{white-space:nowrap}
#toast{position:fixed;z-index:8;top:84px;left:50%;transform:translate(-50%,-8px);opacity:0;background:#1e3c27;color:white;border-radius:12px;padding:10px 16px;font-size:11px;font-weight:800;transition:.2s;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}
#walkHint{position:fixed;z-index:2;right:14px;top:84px;background:#fffef8dc;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:10px;box-shadow:0 6px 20px rgba(30,50,35,0.12);color:#3d523d}
#weather{position:fixed;z-index:2;right:14px;bottom:85px;background:#fffef8dc;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:10px;box-shadow:0 6px 20px rgba(30,50,35,0.12);font-weight:700}
.floater{position:fixed;pointer-events:none;z-index:9;font-weight:900;font-size:13px;text-shadow:0 2px 4px rgba(0,0,0,0.35);animation:floatUp 1.2s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0) scale(0.9)}30%{transform:translate(-50%,-20px) scale(1.12)}100%{opacity:0;transform:translate(-50%,-50px) scale(1)}}
@media(max-width:760px){header{left:7px;right:7px;top:7px;flex-wrap:wrap}.brand h1{font-size:16px}.stats{margin-left:auto}.stat{padding:6px 8px;min-width:67px}.stat b{font-size:13px}.sidebar{left:7px;top:96px;bottom:72px;width:230px}.panel{padding:10px}.bottom{bottom:6px;gap:5px;padding:6px}.message{min-width:90px;font-size:9px}.bottom button{font-size:9px;padding:7px}}
</style></head>
<body>
<div id="world"></div>
<header>
 <div class="brand"><div class="logo">🌻</div><div><h1>Garden World 3D</h1><small>Realistic Farm Simulator</small></div></div>
 <div class="stats">
  <div class="stat"><small>Coins</small><b id="coins">🪙 120</b></div>
  <div class="stat"><small>Level <span id="lvlNum">1</span></small><b id="xpText">0/100 XP</b><div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div></div>
  <div class="stat"><small>Harvests</small><b id="harvests">0</b></div>
 </div>
</header>
<aside class="sidebar">
 <section class="panel"><div class="tabs"><button id="seedTab" class="gold">🌱 Seeds</button><button id="gearTab" class="secondary">🧰 Gear</button><button id="petTab" class="secondary">🐝 Pets</button></div><div id="shop"></div></section>
 <section class="panel"><h2>🎒 Backpack <span id="bagTotal" class="muted">0 items</span></h2><div id="inventory"></div><button id="sellAll" class="gold" style="width:100%;margin-top:8px">Sell all harvested crops</button></section>
 <section class="panel"><h2>📜 Quests</h2><div id="tasks" class="muted"></div></section>
</aside>
<div id="weather">☀️ Sunny · Normal Growth</div>
<div id="walkHint"><b>Controls:</b> WASD walk · Shift run · Click plot to plant/water/harvest</div>
<div class="bottom"><span class="message" id="message">Select a seed, then click an empty soil plot.</span><button id="expand" class="gold">Expand Plot · 250 🪙</button><button id="save" class="secondary">Save Game</button></div>
<div id="toast"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const CROPS=[
 {id:'carrot',name:'Carrot',emoji:'🥕',price:8,value:20,time:14,xp:12,unlockLvl:1,color:0xf28a35},
 {id:'strawberry',name:'Strawberry',emoji:'🍓',price:18,value:48,time:24,xp:25,unlockLvl:1,color:0xe94758},
 {id:'blueberry',name:'Blueberry',emoji:'🫐',price:35,value:95,time:36,xp:45,unlockLvl:2,color:0x6478d7},
 {id:'tomato',name:'Tomato',emoji:'🍅',price:60,value:175,time:50,xp:75,unlockLvl:3,color:0xe64b3f},
 {id:'watermelon',name:'Watermelon',emoji:'🍉',price:110,value:360,time:75,xp:130,unlockLvl:4,color:0x4f9c56},
 {id:'moonflower',name:'Moonflower',emoji:'🌙',price:200,value:780,time:110,xp:250,unlockLvl:5,color:0x9c80d8},
 {id:'starfruit',name:'Starfruit',emoji:'⭐',price:350,value:1450,time:150,xp:400,unlockLvl:6,color:0xffd700},
 {id:'crystal_berry',name:'Crystal Berry',emoji:'💎',price:600,value:2800,time:210,xp:700,unlockLvl:7,color:0x38bdf8},
 {id:'void_blossom',name:'Void Blossom',emoji:'🌌',price:1000,value:5200,time:300,xp:1200,unlockLvl:8,color:0x8b5cf6}
];

const GEARS=[
 {id:'sprinkler',name:'Auto-Sprinkler',emoji:'💦',price:180,desc:'Places a 3D sprinkler. All crops grow 25% faster.'},
 {id:'golden_can',name:'Golden Can',emoji:'✨',price:320,desc:'Doubles mutation chance & +25% double harvest odds.'},
 {id:'fertilizer',name:'Super Fertilizer',emoji:'🧪',price:45,consumable:true,desc:'Click a growing crop with this selected to boost +35%.'}
];

const PETS=[
 {id:'bee',name:'Garden Bee',emoji:'🐝',price:420,desc:'Flies to crops and pollinates them for +25% value.'},
 {id:'bunny',name:'Lucky Bunny',emoji:'🐰',price:680,desc:'Hops around and digs up bonus coins every 15s.'}
];

const KEY='garden_world_3d_hyper_v5';
let S={
 coins:120,level:1,xp:0,harvests:0,selected:'carrot',toolMode:'seed',
 inventory:{carrot:4},fertilizers:0,harvested:{},
 gear:{},pets:[],plots:Array(25).fill(null),tab:'seed'
};

let scene,camera,renderer,controls,raycaster,mouse;
let bedTargets=[],soilMeshes=[],plantObjects=[],hoverRing,sprinklerMesh,rainSystem;
let lastWeather=Date.now(),weather='sun',hoveredIdx=-1;
let fenceGroup=null,farmBounds={halfW:7,halfD:7},petObjects=[],petClock=0,bunnyTimer=0;
const host=document.querySelector('#world');

const mat=(c,r=.8,m=0.05)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
function box(parent,w,h,d,c,x,y,z){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}

function notify(t){
 document.querySelector('#message').textContent=t;
 let e=document.querySelector('#toast');
 e.textContent=t;e.classList.add('show');
 clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200);
}

function spawnFloater(worldPos,text,color='#ffffff'){
 const vec=worldPos.clone().project(camera);
 const x=(vec.x*.5+.5)*innerWidth;
 const y=(-.5*vec.y+.5)*innerHeight;
 const el=document.createElement('div');
 el.className='floater';el.textContent=text;el.style.color=color;
 el.style.left=x+'px';el.style.top=y+'px';
 document.body.appendChild(el);
 setTimeout(()=>el.remove(),1200);
}

function crop(id){return CROPS.find(c=>c.id===id)}
function xpNeeded(lvl){return Math.floor(100*Math.pow(1.45,lvl-1))}
function addXP(amount){
 S.xp+=amount;
 while(S.xp>=xpNeeded(S.level)){
  S.xp-=xpNeeded(S.level);
  S.level++;
  notify(`🎉 Level Up! Your garden is now Level ${S.level}!`);
 }
 save();
}

function growth(p){
 if(!p)return 0;
 let speed=weather==='rain'?1.55:weather==='sun'?1.15:1.0;
 if(S.gear.sprinkler)speed*=1.25;
 if(p.watered)speed*=1.25;
 const elapsed=(Date.now()-p.planted)/1000;
 const bonus=p.boost||0;
 return Math.min(1,(elapsed*speed)/crop(p.id).time + bonus);
}

function save(){localStorage.setItem(KEY,JSON.stringify({...S,savedAt:Date.now()}))}
function load(){
 try{
  let v=JSON.parse(localStorage.getItem(KEY));
  if(v)S={...S,...v};
 }catch(e){}
}

function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0xa4d7e6);
 scene.fog=new THREE.FogExp2(0xa4d7e6,0.014);

 camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,130);
 camera.position.set(12,13,19);

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.12;
 host.appendChild(renderer.domElement);

 controls=new OrbitControls(camera,renderer.domElement);
 controls.target.set(0,0,0);
 controls.enableDamping=true;
 controls.maxPolarAngle=Math.PI*.46;
 controls.minDistance=8;
 controls.maxDistance=36;
 controls.enablePan=false;
 controls.mouseButtons.LEFT=THREE.MOUSE.PAN;
 controls.mouseButtons.RIGHT=THREE.MOUSE.ROTATE;
 renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());

 scene.add(new THREE.HemisphereLight(0xffffff,0x5c7c45,1.9));
 const sun=new THREE.DirectionalLight(0xfff5d6,2.5);
 sun.position.set(-15,25,16);
 sun.castShadow=true;
 sun.shadow.mapSize.set(2048,2048);
 sun.shadow.camera.near=2;sun.shadow.camera.far=70;
 const d=24;sun.shadow.camera.left=-d;sun.shadow.camera.right=d;sun.shadow.camera.top=d;sun.shadow.camera.bottom=-d;
 scene.add(sun);

 // High-quality textured ground
 const grassCanvas=document.createElement('canvas');grassCanvas.width=grassCanvas.height=256;
 const gx=grassCanvas.getContext('2d');gx.fillStyle='#6cb55e';gx.fillRect(0,0,256,256);
 for(let n=0;n<2400;n++){gx.fillStyle=['#5fa352','#7ec46e','#63aa56','#88d077'][n%4];gx.globalAlpha=.3;gx.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*3.5,1+Math.random()*3.5)}
 const grassTex=new THREE.CanvasTexture(grassCanvas);grassTex.wrapS=grassTex.wrapT=THREE.RepeatWrapping;grassTex.repeat.set(12,12);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshStandardMaterial({map:grassTex,roughness:0.95}));
 ground.rotation.x=-Math.PI/2;ground.position.y=-.2;ground.receiveShadow=true;scene.add(ground);

 // Rolling green hills in distance
 for(let i=0;i<18;i++){
  let h=new THREE.Mesh(new THREE.IcosahedronGeometry(5+Math.random()*4,1),mat(i%2?0x7cb869:0x6ca65a,0.9));
  h.scale.y=.45;h.position.set(Math.cos(i/18*Math.PI*2)*36,-1.6,Math.sin(i/18*Math.PI*2)*36);scene.add(h);
 }

 // Realistic Market Counter
 box(scene,3.8,.3,2.3,0x8c5330,9.5,.7,-5);box(scene,4.2,.2,2.7,0x643a24,9.5,1.65,-5);
 box(scene,.15,2,.15,0x724322,7.3,.9,-5.9);box(scene,.15,2,.15,0x724322,11.7,.9,-5.9);
 box(scene,4.3,.2,2.8,0xd4a037,9.5,2,-5);

 // Hover Selection Ring
 hoverRing=new THREE.Mesh(new THREE.RingGeometry(.78,.92,32),new THREE.MeshBasicMaterial({color:0xfff085,side:THREE.DoubleSide,transparent:true,opacity:.9}));
 hoverRing.rotation.x=-Math.PI/2;hoverRing.position.y=.33;hoverRing.visible=false;scene.add(hoverRing);

 // Rain Particles
 const rainGeo=new THREE.BufferGeometry();
 const rainCount=1000;
 const rainPos=new Float32Array(rainCount*3);
 for(let i=0;i<rainCount*3;i+=3){rainPos[i]=(Math.random()-.5)*45;rainPos[i+1]=Math.random()*25;rainPos[i+2]=(Math.random()-.5)*45}
 rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));
 rainSystem=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:0xcbeaff,size:.13,transparent:true,opacity:.7}));
 rainSystem.visible=false;scene.add(rainSystem);

 raycaster=new THREE.Raycaster();mouse=new THREE.Vector2();
 makeGroundDetail();makeOuterGrass();makeFarmer();
}

function makeOuterGrass(){
 const bladeGeo=new THREE.ConeGeometry(.055,.4,3);bladeGeo.translate(0,.2,0);
 const bladeMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.9});
 const count=2800,blades=new THREE.InstancedMesh(bladeGeo,bladeMat,count);
 const dummy=new THREE.Object3D();
 const colors=[new THREE.Color(0x488a3e),new THREE.Color(0x5da350),new THREE.Color(0x6cb85d),new THREE.Color(0x7ecb6f)];
 let made=0,tries=0;
 while(made<count && tries<count*4){
  tries++;
  const x=(Math.random()-.5)*50,z=(Math.random()-.5)*46;
  if(Math.abs(x)<8.5 && Math.abs(z)<8.5)continue;
  dummy.position.set(x,0,z);
  const h=.6+Math.random()*.85,lean=(Math.random()-.5)*.45;
  dummy.scale.set(.6+Math.random()*.8,h,.6+Math.random()*.8);
  dummy.rotation.set(lean,Math.random()*Math.PI*2,lean*.5);
  dummy.updateMatrix();blades.setMatrixAt(made,dummy.matrix);
  blades.setColorAt(made,colors[Math.floor(Math.random()*colors.length)]);
  made++;
 }
 blades.count=made;blades.instanceMatrix.needsUpdate=true;
 if(blades.instanceColor)blades.instanceColor.needsUpdate=true;
 scene.add(blades);
}

let farmer,farmerParts={},farmerVelocity=new THREE.Vector3(),keys={},walkPhase=0;
function makeFarmer(){
 farmer=new THREE.Group();farmer.position.set(0,0,10.2);scene.add(farmer);
 const skin=mat(0xd8b08c,.85),shirt=mat(0x3673a5,.78),trim=mat(0x214768),pants=mat(0x283545),shoes=mat(0x221f1d),hair=mat(0x422e23),eyes=mat(0x222425),detail=mat(0xe5d1b0),hatMat=mat(0xcf9c42,.8);
 function shape(p,g,m,x,y,z,sx=1,sy=1,sz=1){let o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}
 function cap(p,r,l,m,x,y,z){return shape(p,new THREE.CapsuleGeometry(r,l,5,10),m,x,y,z)}
 const torso=new THREE.Group();torso.position.y=1.34;farmer.add(torso);
 shape(torso,new THREE.CapsuleGeometry(.37,.34,6,12),shirt,0,0,0,1,.95,.62);
 shape(torso,new THREE.BoxGeometry(.66,.08,.035),trim,0,-.22,.224);
 shape(torso,new THREE.CylinderGeometry(.115,.13,.16,12),skin,0,.55,0);
 const head=new THREE.Group();head.position.set(0,2.14,0);farmer.add(head);
 shape(head,new THREE.SphereGeometry(.37,20,16),skin,0,0,0,.91,1.04,.86);
 shape(head,new THREE.SphereGeometry(.33,16,12),hair,0,.235,.035,1.02,.58,.95);
 shape(head,new THREE.CylinderGeometry(.56,.58,.05,18),hatMat,0,.31,0);
 shape(head,new THREE.CylinderGeometry(.28,.33,.22,16),hatMat,0,.42,0);
 for(const side of [-1,1]){shape(head,new THREE.SphereGeometry(.035,10,8),eyes,side*.125,.035,-.306,.8,1,.5);shape(head,new THREE.SphereGeometry(.018,8,6),detail,side*.125,.045,-.32,.8,1,.5)}
 const leftArm=new THREE.Group(),rightArm=new THREE.Group();leftArm.position.set(-.43,1.68,0);rightArm.position.set(.43,1.68,0);farmer.add(leftArm,rightArm);
 for(const arm of [leftArm,rightArm]){cap(arm,.145,.34,shirt,0,-.25,0);cap(arm,.105,.34,skin,0,-.62,0);shape(arm,new THREE.SphereGeometry(.105,12,10),skin,0,-.84,-.005,1,.9,.8)}
 const leftLeg=new THREE.Group(),rightLeg=new THREE.Group();leftLeg.position.set(-.2,.94,0);rightLeg.position.set(.2,.94,0);farmer.add(leftLeg,rightLeg);
 for(const leg of [leftLeg,rightLeg]){cap(leg,.17,.38,pants,0,-.25,0);cap(leg,.125,.32,pants,0,-.59,-.005);shape(leg,new THREE.BoxGeometry(.32,.16,.48),shoes,0,-.82,-.075)}
 farmerParts={leftArm,rightArm,leftLeg,rightLeg,torso,head};
}

function makeGroundDetail(){
 for(let i=0;i<7;i++){
  const stone=new THREE.Mesh(new THREE.CylinderGeometry(.52,.58,.09,7),mat(i%2?0xa8a494:0xb8b39f,0.85));
  stone.position.set(-6.1+i*.82,.015,9.3-i*.5);stone.rotation.y=i*.4;stone.receiveShadow=true;scene.add(stone);
 }
 const treeSpots=[[-15,-13],[-17,1],[15,-14],[17,4],[-13,15],[13,16],[-19,10],[19,-9]];
 treeSpots.forEach(([x,z],i)=>{
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.24,.36,2.6,7),mat(0x6e472a,0.9));
  trunk.position.set(x,1.3,z);trunk.castShadow=true;scene.add(trunk);
  const crown=new THREE.Group();crown.position.set(x,2.75,z);scene.add(crown);
  for(let k=0;k<4;k++){const leaf=new THREE.Mesh(new THREE.IcosahedronGeometry(1.1-(k%2)*.12,1),mat([0x377d35,0x448c3f,0x59a34e][(i+k)%3],0.85));leaf.position.set((Math.random()-.5)*.7,k*.3,(Math.random()-.5)*.7);leaf.castShadow=true;crown.add(leaf)}
 });
}

function updateFarmFence(rows){
 if(fenceGroup)scene.remove(fenceGroup);
 fenceGroup=new THREE.Group();scene.add(fenceGroup);
 const halfW=7.25,halfD=Math.max(7.25,((rows-1)*2.35)/2+2.25);
 farmBounds={halfW,halfD};
 const postMat=mat(0x664024,0.8),railMat=mat(0xa67042,0.85),capMat=mat(0x80522c,0.8);
 function rail(w,h,d,x,y,z,material){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;fenceGroup.add(m)}
 const step=2.35;
 for(const z of [-halfD,halfD]){
  rail(halfW*2,.14,.18,0,.72,z,postMat);rail(halfW*2,.13,.2,0,.31,z,railMat);
  for(let x=-halfW;x<=halfW+.01;x+=step){rail(.22,1.05,.24,x,.53,z,capMat);rail(.27,.12,.28,x,.98,z,railMat)}
 }
 for(const x of [-halfW,halfW]){
  rail(.18,.14,halfD*2,x,.72,0,postMat);rail(.2,.13,halfD*2,x,.31,0,railMat);
  for(let z=-halfD;z<=halfD+.01;z+=step){rail(.24,1.05,.22,x,.53,z,capMat);rail(.28,.12,.27,x,.98,z,railMat)}
 }
}

function syncSprinkler(){
 if(S.gear.sprinkler && !sprinklerMesh){
  sprinklerMesh=new THREE.Group();
  const base=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,.2,12),mat(0x434f5e,0.4,0.7));
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.65,8),mat(0x8a99ad,0.3,0.8));stem.position.y=.35;
  const head=new THREE.Mesh(new THREE.BoxGeometry(.75,.08,.08),mat(0x38bdf8,0.3,0.6));head.position.y=.68;
  sprinklerMesh.add(base,stem,head);sprinklerMesh.userData.head=head;

function updateFarmer(dt){
 if(!farmer)return;
 const forwardInput=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
 const sideInput=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
 const sprint=!!(keys.ShiftLeft||keys.ShiftRight);
 const maxSpeed=sprint?8.8:6.2;

 const input=new THREE.Vector2(sideInput,forwardInput);
 if(input.lengthSq()>1)input.normalize();
 const viewForward=new THREE.Vector3();camera.getWorldDirection(viewForward);viewForward.y=0;
 if(viewForward.lengthSq()<.0001)viewForward.set(0,0,-1);
 viewForward.normalize();

 const viewRight=new THREE.Vector3().crossVectors(viewForward,new THREE.Vector3(0,1,0)).normalize();
 const moveDirection=viewRight.multiplyScalar(input.x).add(viewForward.multiplyScalar(input.y));
 if(moveDirection.lengthSq()>0)moveDirection.normalize();

 const blend=1-Math.exp(-(input.lengthSq()>0?24:32)*dt);
 farmerVelocity.x+=(moveDirection.x*maxSpeed-farmerVelocity.x)*blend;
 farmerVelocity.z+=(moveDirection.z*maxSpeed-farmerVelocity.z)*blend;
 farmer.position.x=THREE.MathUtils.clamp(farmer.position.x+farmerVelocity.x*dt,-21,21);
 farmer.position.z=THREE.MathUtils.clamp(farmer.position.z+farmerVelocity.z*dt,-19,19);

 const speed=Math.hypot(farmerVelocity.x,farmerVelocity.z);
 if(speed>.18){
  const faceAngle=Math.atan2(-farmerVelocity.x,-farmerVelocity.z);
  const angleDelta=Math.atan2(Math.sin(faceAngle-farmer.rotation.y),Math.cos(faceAngle-farmer.rotation.y));
  farmer.rotation.y+=angleDelta*(1-Math.exp(-18*dt));
  walkPhase+=dt*(sprint?13.5:10)*(Math.min(speed/maxSpeed,1));
  const stride=Math.sin(walkPhase)*Math.min(.65,speed/maxSpeed*.65);
  farmerParts.leftLeg.rotation.x=THREE.MathUtils.damp(farmerParts.leftLeg.rotation.x,stride,22,dt);
  farmerParts.rightLeg.rotation.x=THREE.MathUtils.damp(farmerParts.rightLeg.rotation.x,-stride,22,dt);
  farmerParts.leftArm.rotation.x=THREE.MathUtils.damp(farmerParts.leftArm.rotation.x,stride*.78,20,dt);
  farmerParts.rightArm.rotation.x=THREE.MathUtils.damp(farmerParts.rightArm.rotation.x,-stride*.78,20,dt);
 }else{
  walkPhase=0;
  for(const part of [farmerParts.leftLeg,farmerParts.rightLeg,farmerParts.leftArm,farmerParts.rightArm])part.rotation.x=THREE.MathUtils.damp(part.rotation.x,0,20,dt);
 }
 const newTarget=farmer.position.clone().add(new THREE.Vector3(0,1.35,0));
 const followDelta=newTarget.sub(controls.target);
 controls.target.add(followDelta);camera.position.add(followDelta);
}

function createPlantMesh(p){
 const g=new THREE.Group(),c=crop(p.id);
 const mut=p.mutation||'normal';
 
 let baseColor=c.color, roughness=0.35, metalness=0.08, emissive=0x000000;
 if(mut==='golden'){baseColor=0xffd700;roughness=0.2;metalness=0.8;emissive=0x443000;}

 else if(mut==='crystal'){baseColor=0x38bdf8;roughness=0.04;metalness=0.92;emissive=0x003355;}

 const leafMat=mat(mut==='golden'?0xeab308:mut==='rainbow'?0xec4899:mut==='crystal'?0x7dd3fc:0x3b8539,.82);

 const sphere=(geo,m,x,y,z,sx=1,sy=1,sz=1)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;o.receiveShadow=true;g.add(o);return o};
 const stem=(x,y,z,h,r=.035)=>{const o=new THREE.Mesh(new THREE.CylinderGeometry(r*.72,r,h,7),stemMat);o.position.set(x,y+h/2,z);o.castShadow=true;g.add(o);return o};
 const leaf=(x,y,z,angle,scale=1,m=leafMat)=>{const o=sphere(new THREE.SphereGeometry(.22,10,7),m,x,y,z,1.45*scale,.24*scale,.58*scale);o.rotation.z=angle;o.rotation.y=angle*.7;return o};

 const height=1.15;
 if(p.id==='carrot'){
  stem(0,.05,0,height,.04);
  for(let k=0;k<7;k++){const a=k*Math.PI*2/7;leaf(Math.cos(a)*.16,height*.82,Math.sin(a)*.16,a,.9,k%2?leafMat:leafLight)}
  const root=sphere(new THREE.ConeGeometry(.22,.85,12),fruitMat,0,.22,0);root.rotation.z=Math.PI;
 }else if(p.id==='strawberry'){
  for(let k=0;k<5;k++){const a=k*Math.PI*2/5;stem(Math.cos(a)*.08,.05,Math.sin(a)*.08,height*.72,.025);leaf(Math.cos(a)*.28,height*.65,Math.sin(a)*.28,a,.8,k%2?leafMat:leafLight)}
  for(let k=0;k<5;k++){const a=k*2.4;const berry=sphere(new THREE.SphereGeometry(.16,12,10),fruitMat,Math.cos(a)*.18,height*.76+(k%2)*.08,Math.sin(a)*.18,.85,1.15,.85);berry.rotation.z=Math.PI}
 }else if(p.id==='blueberry'){
  for(let k=0;k<6;k++){const a=k*Math.PI/3;stem(Math.cos(a)*.14,.04,Math.sin(a)*.14,height*.82,.025);leaf(Math.cos(a)*.3,height*.7,Math.sin(a)*.3,a,.9,k%2?leafMat:leafLight)}
  for(let k=0;k<9;k++){const a=k*2.399,r=.13+(k%3)*.1;sphere(new THREE.SphereGeometry(.105,12,10),fruitMat,Math.cos(a)*r,height*.76+(k%3)*.08,Math.sin(a)*r)}
 }else if(p.id==='tomato'){
  stem(0,.05,0,height,.035);
  for(let k=0;k<5;k++){const a=k*Math.PI*2/5;stem(Math.cos(a)*.17,.1,Math.sin(a)*.17,height*.7,.02);leaf(Math.cos(a)*.28,height*.68,Math.sin(a)*.28,a,.95,k%2?leafMat:leafLight)}
  for(let k=0;k<4;k++){const a=k*Math.PI/2+.4;sphere(new THREE.SphereGeometry(.19,14,12),fruitMat,Math.cos(a)*.2,height*.75+(k%2)*.16,Math.sin(a)*.2)}
 }else if(p.id==='watermelon'){
  for(let k=0;k<5;k++){const a=k*Math.PI*2/5;const vine=new THREE.Mesh(new THREE.CylinderGeometry(.018,.025,.55,6),stemMat);vine.position.set(Math.cos(a)*.3,.14,Math.sin(a)*.3);vine.rotation.z=Math.PI/2;vine.rotation.y=a;g.add(vine);leaf(Math.cos(a)*.48,.2,Math.sin(a)*.48,a,.9,k%2?leafMat:leafLight)}
  sphere(new THREE.SphereGeometry(.34,18,14),fruitMat,0,.31,0,1.35,.82,1.2);
 }else if(p.id==='starfruit'){
  stem(0,.05,0,height*1.1,.04);
  for(let k=0;k<5;k++){const a=k*Math.PI*2/5;sphere(new THREE.SphereGeometry(.22,12,10),fruitMat,Math.cos(a)*.25,height*.8,Math.sin(a)*.25,1.2,1.2,1.2)}
  sphere(new THREE.SphereGeometry(.32,14,12),fruitMat,0,height*1.1,0,1.4,.7,1.4);
 }else if(p.id==='crystal_berry'){
  stem(0,.05,0,height*1.15,.035);
  for(let k=0;k<7;k++){const a=k*Math.PI*2/7;sphere(new THREE.ConeGeometry(.18,.45,6),fruitMat,Math.cos(a)*.22,height*.85+(k%2)*.1,Math.sin(a)*.22)}
 }else if(p.id==='void_blossom'){
  stem(0,.05,0,height*1.3,.045);
  for(let k=0;k<8;k++){const a=k*Math.PI/4;const petal=sphere(new THREE.SphereGeometry(.22,12,9),fruitMat,Math.cos(a)*.28,height*1.2,Math.sin(a)*.28,1.4,.5,.8);petal.rotation.y=a}
  sphere(new THREE.SphereGeometry(.18,14,12),mat(0xfc8181,.2,.8,0.5),0,height*1.2,0);
 }else{
  stem(0,.08,0,height*1.2,.035);
  for(let k=0;k<6;k++){const a=k*Math.PI/3;leaf(Math.cos(a)*.28,height*.42,Math.sin(a)*.28,a,1,k%2?leafMat:leafLight)}
  for(let k=0;k<8;k++){const a=k*Math.PI/4;const petal=sphere(new THREE.SphereGeometry(.17,12,9),fruitMat,Math.cos(a)*.2,height*1.18,Math.sin(a)*.2,1.15,.48,.7);petal.rotation.y=a}
  sphere(new THREE.SphereGeometry(.13,12,10),mat(0xffdf78),0,height*1.18,0);
 }

 const glint=sphere(new THREE.OctahedronGeometry(.14),mat(0xfff08a,.2,.3),0,height*1.45,0);
 glint.visible=false;
 let baseScale=mut==='giant'?1.45:1.0;
 g.userData={glint,baseScale,phase:Math.random()*Math.PI*2};

function getPlotPos(i){
 const rows=Math.ceil(S.plots.length/5);
 return new THREE.Vector3((i%5-2)*2.35,0,(Math.floor(i/5)-(rows-1)/2)*2.35);
}

function rebuild(){
 for(let o of plantObjects)if(o)scene.remove(o);
 for(let b of bedTargets)scene.remove(b.parent);
 plantObjects=[];bedTargets=[];soilMeshes=[];
 const rows=Math.ceil(S.plots.length/5);
 updateFarmFence(rows);
 S.plots.forEach((p,i)=>{
  const pos=getPlotPos(i);
  const g=new THREE.Group();g.position.copy(pos);scene.add(g);
  box(g,2.12,.25,2.12,0x684226,0,.02,0);
  box(g,1.94,.11,1.94,0x7d4f2e,0,.17,0);
  const soilColor=(p&&p.watered)?0x211711:0x3b2c21;
  const soil=box(g,1.84,.1,1.84,soilColor,0,.24,0);
  soil.userData.index=i;bedTargets.push(soil);soilMeshes.push(soil);
  for(let r=-2;r<=2;r++)box(g,1.55,.018,.025,0x5c422d,0,.30,r*.27);
  if(p){
   const obj=createPlantMesh(p);
   obj.position.set(pos.x,.30,pos.z);
   const prog=growth(p);
   const s=(0.25+prog*0.75)*obj.userData.baseScale;
   obj.scale.set(s,s,s);
   scene.add(obj);plantObjects[i]=obj;
  }
 });
}

 const part=(geo,m,x,y,z,sx=1,sy=1,sz=1)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;group.add(o);return o};
 if(id==='bee'){

  const w1=part(new THREE.SphereGeometry(.2,12,8),wing,-.2,.91,.04,.65,1.15,.18),w2=part(new THREE.SphereGeometry(.2,12,8),wing,.2,.91,.04,.65,1.15,.18);

 }else{

function syncPets(){
 for(const p of petObjects)scene.remove(p);

function updatePets(dt){
 petClock+=dt;
 petObjects.forEach((p,i)=>{
  const phase=petClock*(p.userData.id==='bee'?.75:.5)+p.userData.phase;
  const rx=Math.max(2,farmBounds.halfW-1.3),rz=Math.max(2,farmBounds.halfD-1.3);
  p.position.set(Math.sin(phase)*rx,p.userData.baseY+(p.userData.id==='bee'?Math.sin(petClock*5+i)*.18:Math.abs(Math.sin(petClock*3.5+i))*.12),Math.cos(phase*.83)*rz);
  p.rotation.y=Math.atan2(Math.cos(phase)*rx,-Math.sin(phase*.83)*.83*rz);
  if(p.userData.id==='bee'){
   p.userData.w1.rotation.z=Math.sin(petClock*22)*.35-.35;
   p.userData.w2.rotation.z=-Math.sin(petClock*22)*.35+.35;
  }
 });
 if(S.pets.includes('bunny')){
  bunnyTimer+=dt;
  if(bunnyTimer>=15){
   bunnyTimer=0;
   const bonus=15*S.level;
   S.coins+=bonus;
   const bObj=petObjects.find(x=>x.userData.id==='bunny');
   if(bObj)spawnFloater(bObj.position.clone().add(new THREE.Vector3(0,1,0)),`+${bonus} 🪙`,'#eab308');
   updateShop();save();
  }
 }
}

  return;
 }

 const prog=growth(p);
 if(prog>=1){
  let c=crop(p.id);
  let key=`${p.id}:${p.mutation||'normal'}`;
  let qty=1;
  if(S.gear.golden_can && Math.random()<0.3)qty=2;
  S.plots[idx]=null;
  S.harvested[key]=(S.harvested[key]||0)+qty;
  S.harvests+=qty;
  addXP(c.xp*qty);
  rebuild();updateShop();updateTasks();save();
  spawnFloater(pos,`+${qty} ${c.emoji} (+${c.xp*qty} XP)`,'#fef08a');
  notify(`Harvested ${qty}x ${p.mutation!=='normal'?p.mutation+' ':''}${c.name}!`);
  return;
 }

 if(S.toolMode==='fertilizer' && S.fertilizers>0){
  S.fertilizers--;
  p.boost=(p.boost||0)+0.35;
  if(S.fertilizers<=0)S.toolMode='seed';
  updateShop();save();
  spawnFloater(pos,'🧪 +35% GROWTH!','#c084fc');
  return;
 }

 if(!p.watered){
  p.watered=true;
  soilMeshes[idx].material.color.setHex(0x19110d);
  spawnFloater(pos,'💧 Watered (+25% speed)','#38bdf8');
  notify('Watered crop!');save();
 }else{
  notify(`Growing: ${Math.floor(prog*100)}% complete`);
 }
});

load();init();syncPets();syncSprinkler();rebuild();updateShop();updateTasks();
let clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 let dt=clock.getDelta();
 let now=Date.now();

 if(now-lastWeather>45000){
  lastWeather=now;
  weather=['sun','rain','wind'][Math.floor(Math.random()*3)];
  rainSystem.visible=(weather==='rain');
  const skyColor=weather==='rain'?0x6d8b9a:weather==='wind'?0x98c5d6:0xa4d7e6;
  scene.background.setHex(skyColor);
  scene.fog.color.setHex(skyColor);
  document.querySelector('#weather').textContent=
   weather==='rain'?'🌧️ Rainy · +55% growth & auto-waters':
   weather==='wind'?'🍃 Breezy · Normal growth':'☀️ Sunny · +15% growth';
 }

 if(rainSystem.visible){
  const pos=rainSystem.geometry.attributes.position.array;
  for(let i=1;i<pos.length;i+=3){
   pos[i]-=25*dt;
   if(pos[i]<0)pos[i]=25;
  }
  rainSystem.geometry.attributes.position.needsUpdate=true;
  S.plots.forEach((p,i)=>{if(p&&!p.watered){p.watered=true;if(soilMeshes[i])soilMeshes[i].material.color.setHex(0x19110d);}});
 }

 if(sprinklerMesh)sprinklerMesh.userData.head.rotation.y+=4*dt;

 const t=clock.elapsedTime;
 for(let i=0;i<S.plots.length;i++){
  const p=S.plots[i];
  const obj=plantObjects[i];
  if(p && obj){
   const prog=growth(p);
   const s=(0.22+prog*0.78)*obj.userData.baseScale;
   obj.scale.set(s,s,s);
   const swayAmp=weather==='wind'?0.08:0.03;
   obj.rotation.z=Math.sin(t*2.2+obj.userData.phase)*swayAmp;
   if(prog>=1 && obj.userData.glint){
    obj.userData.glint.visible=true;
    obj.userData.glint.rotation.y+=2.5*dt;
    obj.userData.glint.position.y=1.65+Math.sin(t*4+i)*0.12;
   }
  }
 }

 updateFarmer(dt);
 updatePets(dt);
 controls.update();
 renderer.render(scene,camera);
}
animate();
</script>
