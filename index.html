const KEY='garden_world_3d_v2';

function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0xb7dfed);scene.fog=new THREE.Fog(0xb7dfed,28,65);camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(10,10,17);

const grassCanvas=document.createElement('canvas');grassCanvas.width=grassCanvas.height=256;const gx=grassCanvas.getContext('2d');gx.fillStyle='#78b86d';gx.fillRect(0,0,256,256);for(let n=0;n<1800;n++){gx.fillStyle=['#6ca962','#8bc67b','#72ad65','#98cb83'][n%4];gx.globalAlpha=.25;gx.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*3,1+Math.random()*3)}gx.globalAlpha=1;const grassTex=new THREE.CanvasTexture(grassCanvas);grassTex.wrapS=grassTex.wrapT=THREE.RepeatWrapping;grassTex.repeat.set(8,8);const groundMat=new THREE.MeshStandardMaterial({map:grassTex,color:0xffffff,roughness:1});const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),groundMat);ground.rotation.x=-Math.PI/2;ground.position.y=-.2;ground.receiveShadow=true;scene.add(ground);

// decorative flowers

// Dense decorative grass outside the fenced plot. Instanced meshes keep this lightweight.
function makeOuterGrass(){
 const bladeGeo=new THREE.ConeGeometry(.055,.38,3);
 bladeGeo.translate(0,.19,0);
 const bladeMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:1});
 const count=2600, blades=new THREE.InstancedMesh(bladeGeo,bladeMat,count);
 const dummy=new THREE.Object3D();
 const colors=[new THREE.Color(0x4f9147),new THREE.Color(0x65a94f),new THREE.Color(0x78b85d),new THREE.Color(0x8ac56a),new THREE.Color(0x588f43)];
 let made=0, tries=0;
 while(made<count && tries<count*4){
  tries++;
  const x=(Math.random()-.5)*44, z=(Math.random()-.5)*40;
  if(Math.abs(x)<7.9 && Math.abs(z)<7.9)continue;
  if(Math.abs(x+3.5)<2.7 && z>5.2 && z<11.2)continue;
  if(x>6.5 && x<12 && z>-7.5 && z<-2.5)continue;
  dummy.position.set(x,0,z);
  const h=.65+Math.random()*.8, lean=(Math.random()-.5)*.42;
  dummy.scale.set(.65+Math.random()*.75,h,.65+Math.random()*.75);
  dummy.rotation.set(lean,Math.random()*Math.PI*2,lean*.5);
  dummy.updateMatrix();blades.setMatrixAt(made,dummy.matrix);
  blades.setColorAt(made,colors[Math.floor(Math.random()*colors.length)]);
  made++;
 }
 blades.count=made;blades.instanceMatrix.needsUpdate=true;
 if(blades.instanceColor)blades.instanceColor.needsUpdate=true;

}
raycaster=new THREE.Raycaster();mouse=new THREE.Vector2();makeGroundDetail();makeOuterGrass();makeFarmer()}

let farmer, farmerParts={}, farmerVelocity=new THREE.Vector3(), keys={}, walkPhase=0, idlePhase=0;

 mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh;
}
function makeFarmer(){
 farmer=new THREE.Group();farmer.position.set(0,0,10.2);scene.add(farmer);
 const skin=new THREE.MeshStandardMaterial({color:0xdcae88,roughness:.88}),shirt=new THREE.MeshStandardMaterial({color:0x3d79a8,roughness:.82}),trim=new THREE.MeshStandardMaterial({color:0x244f70}),pants=new THREE.MeshStandardMaterial({color:0x303e50}),shoes=new THREE.MeshStandardMaterial({color:0x292522}),hair=new THREE.MeshStandardMaterial({color:0x493326}),eyes=new THREE.MeshStandardMaterial({color:0x282a2b}),detail=new THREE.MeshStandardMaterial({color:0xe6d4b4});
 function shape(p,g,m,x,y,z,sx=1,sy=1,sz=1){let o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}

 const torso=new THREE.Group();torso.position.y=1.34;farmer.add(torso);
 shape(torso,new THREE.CapsuleGeometry(.37,.34,6,12),shirt,0,0,0,1,.95,.62);

 shape(torso,new THREE.BoxGeometry(.22,.09,.045),trim,0,.37,.12);
 shape(torso,new THREE.CylinderGeometry(.115,.13,.16,12),skin,0,.55,0);
 const head=new THREE.Group();head.position.set(0,2.14,0);farmer.add(head);
 shape(head,new THREE.SphereGeometry(.37,20,16),skin,0,0,0,.91,1.04,.86);
 shape(head,new THREE.SphereGeometry(.33,16,12),hair,0,.235,.035,1.02,.58,.95);
 shape(head,new THREE.SphereGeometry(.22,14,10),hair,0,.12,-.22,1.15,.5,.65);
 for(const side of [-1,1]){shape(head,new THREE.SphereGeometry(.075,10,8),skin,side*.34,-.015,0,.7,1,.7);shape(head,new THREE.SphereGeometry(.035,10,8),eyes,side*.125,.035,-.306,.8,1,.5);shape(head,new THREE.SphereGeometry(.018,8,6),detail,side*.125,.045,-.32,.8,1,.5)}

 const leftLeg=new THREE.Group(),rightLeg=new THREE.Group();leftLeg.position.set(-.2,.94,0);rightLeg.position.set(.2,.94,0);farmer.add(leftLeg,rightLeg);
 for(const leg of [leftLeg,rightLeg]){cap(leg,.17,.38,pants,0,-.25,0);cap(leg,.125,.32,pants,0,-.59,-.005);shape(leg,new THREE.BoxGeometry(.32,.16,.48),shoes,0,-.82,-.075);shape(leg,new THREE.BoxGeometry(.29,.035,.025),detail,0,-.77,-.31)}

function makeGroundDetail(){
 // A winding stone path leading from the entrance toward the planting beds.
 for(let i=0;i<7;i++){
  const stone=new THREE.Mesh(new THREE.CylinderGeometry(.52,.58,.09,7),mat(i%2?0xb8b4a4:0xc9c4b1));
  stone.position.set(-6.1+i*.82,.015,9.3-i*.5);stone.rotation.y=i*.4;stone.receiveShadow=true;scene.add(stone);
 }
 // The garden fence is generated dynamically from the current plot count.
 // Small rocks and tufts around the garden edge.
 for(let i=0;i<34;i++){
  const x=(Math.random()-.5)*28,z=(Math.random()-.5)*25;
  if(Math.abs(x)<7.8&&Math.abs(z)<8)continue;
  const pebble=new THREE.Mesh(new THREE.DodecahedronGeometry(.12+Math.random()*.12,0),mat(i%3?0x8b9b79:0xaaa18b));

 });
 for(let i=0;i<34;i++){

  for(let k=0;k<3;k++){const leaf=new THREE.Mesh(new THREE.SphereGeometry(.34,9,7),mat(k%2?0x4c9143:0x5da34b));leaf.position.set((k-1)*.25,.12+(k%2)*.08,Math.sin(k)*.12);leaf.scale.set(1,.8,1);leaf.castShadow=true;bush.add(leaf)}

function updateFarmFence(rows){

 const postMat=mat(0x704629),railMat=mat(0xb27a49),capMat=mat(0x8b5a32);

  rail(halfW*2,.14,.18,0,.72,z,postMat);rail(halfW*2,.13,.2,0,.31,z,railMat);
  for(let x=-halfW;x<=halfW+.01;x+=step){rail(.22,1.05,.24,x,.53,z,capMat);rail(.27,.12,.28,x,.98,z,railMat)}

 for(const x of [-halfW,halfW]){
  rail(.18,.14,halfD*2,x,.72,0,postMat);rail(.2,.13,halfD*2,x,.31,0,railMat);
  for(let z=-halfD;z<=halfD+.01;z+=step){rail(.24,1.05,.22,x,.53,z,capMat);rail(.28,.12,.27,x,.98,z,railMat)}

function updateFarmer(dt){
 if(!farmer)return;
 // Roblox-style camera-relative controls: W follows the camera view, A/D strafe,
 // and the avatar smoothly turns to face the direction it is actually travelling.
 const forwardInput=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
 const sideInput=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
 const sprint=!!(keys.ShiftLeft||keys.ShiftRight);
 const maxSpeed=sprint?8:5.8;

 const input=new THREE.Vector2(sideInput,forwardInput);
 if(input.lengthSq()>1)input.normalize();

 const viewForward=new THREE.Vector3();
 camera.getWorldDirection(viewForward);
 viewForward.y=0;
 if(viewForward.lengthSq()<.0001)viewForward.set(0,0,-1);
 viewForward.normalize();

 // Correct right vector: positive D must move to the character's right.
 const viewRight=new THREE.Vector3().crossVectors(viewForward,new THREE.Vector3(0,1,0)).normalize();
 const moveDirection=viewRight.multiplyScalar(input.x).add(viewForward.multiplyScalar(input.y));
 if(moveDirection.lengthSq()>0)moveDirection.normalize();

 const desiredX=moveDirection.x*maxSpeed;
 const desiredZ=moveDirection.z*maxSpeed;
 const accelerating=input.lengthSq()>0;
 const response=accelerating?22:30;
 const blend=1-Math.exp(-response*dt);
 farmerVelocity.x+=(desiredX-farmerVelocity.x)*blend;
 farmerVelocity.z+=(desiredZ-farmerVelocity.z)*blend;

 farmer.position.x+=farmerVelocity.x*dt;
 farmer.position.z+=farmerVelocity.z*dt;

 // Open grassy area around the farm is walkable; keep the player within the world.
 farmer.position.x=THREE.MathUtils.clamp(farmer.position.x,-19,19);
 farmer.position.z=THREE.MathUtils.clamp(farmer.position.z,-17,17);

 const speed=Math.hypot(farmerVelocity.x,farmerVelocity.z);
 const moving=speed>.18;
 if(moving){
  const faceAngle=Math.atan2(-farmerVelocity.x,-farmerVelocity.z);
  const angleDelta=Math.atan2(Math.sin(faceAngle-farmer.rotation.y),Math.cos(faceAngle-farmer.rotation.y));
  farmer.rotation.y+=angleDelta*(1-Math.exp(-16*dt));

  // Even, speed-scaled stride with opposite arm/leg swing.
  walkPhase+=dt*(sprint?12.5:9.2)*(Math.min(speed/maxSpeed,1));
  const stride=Math.sin(walkPhase)*Math.min(.62,speed/maxSpeed*.62);
  const counter=Math.sin(walkPhase+Math.PI)*Math.min(.62,speed/maxSpeed*.62);
  farmerParts.leftLeg.rotation.x=THREE.MathUtils.damp(farmerParts.leftLeg.rotation.x,stride,20,dt);
  farmerParts.rightLeg.rotation.x=THREE.MathUtils.damp(farmerParts.rightLeg.rotation.x,counter,20,dt);
  farmerParts.leftArm.rotation.x=THREE.MathUtils.damp(farmerParts.leftArm.rotation.x,-counter*.78,18,dt);
  farmerParts.rightArm.rotation.x=THREE.MathUtils.damp(farmerParts.rightArm.rotation.x,-stride*.78,18,dt);
  farmerParts.torso.rotation.x=THREE.MathUtils.damp(farmerParts.torso.rotation.x,sprint?-.055:-.025,8,dt);
 }else{
  walkPhase=0;
  for(const part of [farmerParts.leftLeg,farmerParts.rightLeg,farmerParts.leftArm,farmerParts.rightArm]){
   part.rotation.x=THREE.MathUtils.damp(part.rotation.x,0,18,dt);
  }
  farmerParts.torso.rotation.x=THREE.MathUtils.damp(farmerParts.torso.rotation.x,0,10,dt);
 }

 // Keep the third-person camera locked to the avatar's follow point without
 // dragging the orbit target behind the player or changing the orbit distance.
 const newTarget=farmer.position.clone().add(new THREE.Vector3(0,1.35,0));
 const followDelta=newTarget.sub(controls.target);
 controls.target.add(followDelta);
 camera.position.add(followDelta);
}
function plantModel(id,v){

  for(let k=0;k<6;k++){const a=k*Math.PI/3;stem(Math.cos(a)*.14,.04,Math.sin(a)*.14,height*.82,.025);leaf(Math.cos(a)*.3,height*.7,Math.sin(a)*.3,a,.9,k%2?leafMat:leafLight)}
  for(let k=0;k<9;k++){const a=k*2.399,r=.13+(k%3)*.1;sphere(g,new THREE.SphereGeometry(.105,12,10),fruitMat,Math.cos(a)*r,height*.76+(k%3)*.08,Math.sin(a)*r)}

 }else if(id==='tomato'){
  stem(0,.05,0,height,.035);
  for(let k=0;k<5;k++){const a=k*Math.PI*2/5;stem(Math.cos(a)*.17,.1,Math.sin(a)*.17,height*.7,.02);leaf(Math.cos(a)*.28,height*.68,Math.sin(a)*.28,a,.95,k%2?leafMat:leafLight)}

 }else if(id==='watermelon'){
  for(let k=0;k<5;k++){const a=k*Math.PI*2/5;const vine=new THREE.Mesh(new THREE.CylinderGeometry(.018,.025,.55,6),stemMat);vine.position.set(Math.cos(a)*.3,.14,Math.sin(a)*.3);vine.rotation.z=Math.PI/2;vine.rotation.y=a;g.add(vine);leaf(Math.cos(a)*.48,.2,Math.sin(a)*.48,a,.9,k%2?leafMat:leafLight)}
  sphere(g,new THREE.SphereGeometry(.32,18,14),fruitMat,0,.31,0,1.35,.82,1.2);
  const stripeMat=mat(0x246b37);
  for(let k=0;k<7;k++){const a=k*Math.PI*2/7;const stripe=sphere(g,new THREE.SphereGeometry(.325,12,10),stripeMat,Math.cos(a)*.045,.31,Math.sin(a)*.045,1.3,.83,.04);stripe.rotation.y=a}
 }else{
  stem(0,.08,0,height*1.2,.035);
  for(let k=0;k<6;k++){const a=k*Math.PI/3;leaf(Math.cos(a)*.28,height*.42,Math.sin(a)*.28,a,1,k%2?leafMat:leafLight)}
  for(let k=0;k<8;k++){const a=k*Math.PI/4;const petal=sphere(g,new THREE.SphereGeometry(.16,12,9),fruitMat,Math.cos(a)*.2,height*1.18,Math.sin(a)*.2,1.15,.48,.7);petal.rotation.y=a}

function rebuild(){
 for(let o of plantObjects)scene.remove(o);for(let b of bedTargets)scene.remove(b);
 plantObjects=[];bedTargets=[];
 const rows=Math.ceil(S.plots.length/5);
 updateFarmFence(rows);
 S.plots.forEach((p,i)=>{
  const x=(i%5-2)*2.35,z=(Math.floor(i/5)-(rows-1)/2)*2.35;
  const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
  box(g,2.12,.25,2.12,0x765033,0,.02,0);
  box(g,1.94,.11,1.94,0x8b5a36,0,.17,0);
  const soil=box(g,1.84,.1,1.84,0x3f3026,0,.24,0);soil.userData.index=i;bedTargets.push(soil);
  // Fine soil furrows and little stones at the edge of each planting bed.
  for(let r=-2;r<=2;r++){const furrow=box(g,1.55,.018,.025,0x674b34,0,.30,r*.27);furrow.position.z=r*.27}
  for(let k=0;k<4;k++){const peb=new THREE.Mesh(new THREE.DodecahedronGeometry(.045,0),mat(k%2?0x9b8a70:0xb0a080));peb.position.set((k<2?-1:1)*(.78+Math.random()*.06),.31,(k%2?-1:1)*(.78+Math.random()*.06));g.add(peb)}
  if(p){const obj=plantModel(p.id,growth(p));obj.position.set(x,.34,z);scene.add(obj);plantObjects.push(obj)}
 });
}
function makePet(id){

 const part=(geo,m,x,y,z,sx=1,sy=1,sz=1)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;o.receiveShadow=true;group.add(o);return o};
 if(id==='bee'){
  part(new THREE.SphereGeometry(.29,14,12),fur,0,.52,0,1.25,.85,.85);
  for(let x of [-.09,.09])part(new THREE.BoxGeometry(.07,.52,.5),dark,x,.52,0,1,.9,1);

  for(let x of [-.1,.1]){const ant=part(new THREE.CylinderGeometry(.012,.018,.16,6),dark,x,.94,-.31);ant.rotation.z=x*2}
 }else{
  part(new THREE.SphereGeometry(.27,14,12),fur,0,.36,0,1.2,.9,1.1);

  for(let x of [-.13,.13]){const ear=part(new THREE.CapsuleGeometry(.07,.34,5,8),fur,x,.99,-.2,.9,1,1);ear.rotation.z=x<0?-.18:.18;part(new THREE.SphereGeometry(.035,8,6),pink,x,.99,-.264,.8,1,.4)}

function syncPets(){
 for(const p of petObjects)scene.remove(p);
 petObjects=[];
 for(const id of S.pets||[])petObjects.push(makePet(id));
}
function updatePets(dt){
 petClock+=dt;
 petObjects.forEach((p,i)=>{
  const phase=petClock*(p.userData.id==='bee'?.72:.48)+p.userData.phase;
  const rx=Math.max(2,farmBounds.halfW-1.3),rz=Math.max(2,farmBounds.halfD-1.3);
  p.position.set(Math.sin(phase)*rx,p.userData.baseY+(p.userData.id==='bee'?Math.sin(petClock*5+i)*.18:Math.abs(Math.sin(petClock*3+i))*.08),Math.cos(phase*.83)*rz);
  p.rotation.y=Math.atan2(Math.cos(phase)*rx,-Math.sin(phase*.83)*.83*rz);
  if(p.userData.id==='bee'){p.children.forEach((o,j)=>{if(j===8||j===9)o.rotation.z=Math.sin(petClock*16)*.3})}
 }
 );
}

let id=S.selected;if(!(S.inventory[id]>0)){notify('You need more '+crop(id).name+' seeds.');return}S.inventory[id]--;S.plots[i]={id,planted:Date.now()};save();rebuild();update();notify('Planted '+crop(id).name+'!')}
